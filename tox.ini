# tox configuration for Cog.

[tox]
envlist = py3{11-15}, coverage

[testenv]
deps =
    coverage==7.17.1
    pytest
    pytest-cov

commands =
    #coverage run -m pytest {posargs}
    python -m pytest --cov {posargs}

usedevelop = True

[testenv:coverage]
skip_install = True
commands =
    coverage combine -q
    coverage report -m

[gh]
python =
    3.11 = py311
    3.12 = py312
    3.13 = py313
    3.14 = py314
    3.15 = py315
